<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">YeaAnBus — 안동과 예천의 버스 정보를 한눈에</title>
  <desc id="desc">남색과 호박색을 사용한 프로젝트 소개 배너. 오른쪽에는 버스 도착 전광판을 표현한 일러스트가 있습니다. 실제 앱 스크린샷은 아닙니다.</desc>
